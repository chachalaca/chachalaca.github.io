<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camping Overnight Stay Sign - 15x20cm</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: 'Open Sans', sans-serif;
            padding: 20px;
        }

        .sign-container {
            width: 566px; /* 15cm at 96dpi */
            height: 755px; /* 20cm at 96dpi */
            background: #667eea;
            border-radius: 0; /* Sharp corners */
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
        }

        .sign-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 8s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .screw-hole {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #2d3748;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            left: 50%;
            transform: translateX(-50%);
        }

        .screw-hole::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #1a202c;
            border-radius: 50%;
        }

        .screw-hole.top {
            top: 35px;
        }

        .screw-hole.bottom {
            bottom: 35px;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .icon-header {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            margin-bottom: 10px;
            margin-top: 45px;
        }

        .icon-header svg {
            width: 70px;
            height: 70px;
            fill: white;
        }

        .tent-icon {
            position: relative;
        }

        .text-section {
            text-align: center;
            color: white;
        }

        .main-text {
            font-family: 'Open Sans', sans-serif;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .sub-text {
            font-size: 24px;
            font-weight: 500;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 300px;
            height: 3px;
            background: rgba(255,255,255,0.5);
            border-radius: 2px;
        }

        .qr-section {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 0; /* Sharp corners */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(20px);
        }

        .qr-code {
            width: 250px;
            height: 250px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e2e8f0;
            border-radius: 0; /* Sharp corners */
            position: relative;
            overflow: hidden;
        }

        .qr-placeholder {
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(45deg, #000 0, #000 5px, #fff 5px, #fff 10px),
                repeating-linear-gradient(-45deg, #000 0, #000 5px, #fff 5px, #fff 10px);
            opacity: 0.1;
        }

        .qr-text {
            position: absolute;
            font-size: 12px;
            color: #4a5568;
            text-align: center;
            font-weight: 600;
            padding: 10px;
        }

        .qr-label {
            margin-top: 15px;
            font-size: 14px;
            color: #4a5568;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media print {
            body {
                background: white;
            }

            .sign-container {
                width: 15cm;
                height: 20cm;
                box-shadow: none;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="sign-container">
        <!-- Screw holes - only 2, centered top and bottom -->
        <div class="screw-hole top"></div>
        <div class="screw-hole bottom"></div>

        <div class="content-wrapper">
            <!-- Camping Icon (Tent and Camper) -->
            <div class="icon-header">
              <svg viewBox="0 0 100 100" class="tent-icon">
                  <!-- Crescent Moon (top right, better crescent shape) -->
                  <defs>
                      <mask id="crescentMask">
                          <rect width="100" height="100" fill="black"/>
                          <circle cx="78" cy="20" r="8" fill="white"/>
                          <circle cx="82" cy="18" r="6" fill="black"/>
                      </mask>
                  </defs>
                  <circle cx="78" cy="20" r="8" fill="white" mask="url(#crescentMask)" opacity="1"/>

                  <!-- Small stars around moon -->
                  <circle cx="65" cy="25" r="1.5" fill="white" opacity="0.8"/>
                  <circle cx="68" cy="35" r="1" fill="white" opacity="0.6"/>
                  <circle cx="58" cy="32" r="1.2" fill="white" opacity="0.7"/>

                  <!-- Tent -->
                  <path d="M15 75 L35 40 L55 75 Z" fill="white" opacity="0.9"/>
                  <path d="M25 75 L35 55 L45 75 Z" fill="rgba(0,0,0,0.2)"/>

                  <!-- Camper/RV  -->
                  <rect x="60" y="50" width="25" height="20" fill="white" opacity="0.9" rx="2"/>
                  <circle cx="67" cy="74" r="3" fill="rgba(0,0,0,0.3)"/>
                  <circle cx="78" cy="74" r="3" fill="rgba(0,0,0,0.3)"/>
                  <rect x="63" y="56" width="8" height="8" fill="rgba(0,0,0,0.2)"/>
                  <rect x="75" y="56" width="8" height="8" fill="rgba(0,0,0,0.2)"/>

                  <!-- Ground line (moved down) -->
                  <line x1="10" y1="80" x2="90" y2="80" stroke="white" stroke-width="2" opacity="0.5"/>
              </svg>
            </div>

            <!-- Czech Text (as question) -->
            <div class="text-section">
                <h1 class="main-text">Nocujete zde?</h1>
                <div class="divider"></div>
            </div>

            <!-- English Text (as question) -->
            <div class="text-section">
                <h2 class="sub-text">Staying overnight here?</h2>
            </div>
